    const tl = gsap.timeline({ paused: true });

    // Window arrives, leaves at the end.

      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },

    );

    // Captions: blur in on their start, blur out just before their end.
    const captions = [
      ["#cap1 p", 0.1, 4],
      ["#cap2 p", 4, 8.4],
      ["#cap3 p", 8.4, 10.6],
      ["#cap4 p", 10.6, 13.8],
      ["#cap5 p", 13.8, 17.8],
    ];
    captions.forEach(([selector, start, end]) => {
      tl.fromTo(
        selector,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" },
        start,
      );
      tl.fromTo(
        selector,
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in", immediateRender: false },
        end - 0.17,
      );
    });

    // Each block: type the command, then print its output.
    const blocks = [
      ["#cmd1", "#caret1", ".out1", 0.35],
      ["#cmd2", "#caret2", ".out2", 4.15],
      ["#cmd3", "#caret3", ".out3", 8.55],
      ["#cmd4", "#caret4", ".out4", 13.95],
    ];
    blocks.forEach(([cmd, caret, out, start]) => {
      const length = document.querySelector(cmd).textContent.length;
      const typing = Math.min(0.85, length * 0.028);
      tl.fromTo(cmd, { width: "0ch" }, { width: `${length + 0.4}ch`, duration: typing, ease: `steps(${length})` }, start);
      tl.fromTo(caret, { opacity: 1 }, { opacity: 0, duration: 0.01 }, start + typing + 0.25);
      tl.fromTo(out, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.035 }, start + typing + 0.3);
    });

    // Punch in on the version line.
    tl.set("#term-win", { transformOrigin: "50% 27%" }, 0);
    tl.fromTo("#term-win", { scale: 1 }, { scale: 1.12, duration: 0.55, ease: "power2.inOut" }, 10.6);
    tl.fromTo(
      "#rel-ver",
      { backgroundColor: "rgba(255, 77, 79, 0)" },
      { backgroundColor: "rgba(255, 77, 79, 0.28)", duration: 0.3, ease: "power2.out" },

    );
