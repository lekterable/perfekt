name: Commitlint

on:
  workflow_call:

  # perfekt's own CI lints the title on every run, so this only catches a later title edit.
  pull_request:
    branches: [master]
    types: [edited]

jobs:
  pr-title:
    name: PR title
    # Skips pushes (synchronize), drafts and edits that leave the title as it was, such as a body
    # edit. A caller that also runs the shared CI only needs `types: [edited]`; one without it
    # keeps opened and reopened too.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'synchronize' &&
      !github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.title.from != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A newer push or title edit on the same PR cancels the older run. Keyed on
    # the repository too, since every repo calls this workflow at @master.
    concurrency:
      group: commitlint-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          repository: lekterable/perfekt
          # perfekt's own PRs lint against their own rules; callers use master
          ref: ${{ github.repository == 'lekterable/perfekt' && github.event.pull_request.head.sha || 'master' }}
          path: perfekt
          sparse-checkout: src/core/lint.ts
          sparse-checkout-cone-mode: false
      # Node 26 runs the TypeScript rules directly, so there is nothing to install.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Lint PR title
        working-directory: perfekt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --no-warnings --input-type=module -e '
            import { formatLint, lintMessage } from "./src/core/lint.ts"
            const title = process.env.PR_TITLE
            const result = lintMessage(title)
            console.log(formatLint(title, result))
            process.exitCode = result.valid ? 0 : 1
          '
