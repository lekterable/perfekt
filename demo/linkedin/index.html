<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0c0c10;
        --ink: #f5f5f7;
        --muted: #8b8b98;
        --accent: #ff4d4f;
        --font-display: "Inter";
        --font-mono: "JetBrains Mono";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 700px at 85% -5%, rgba(255, 77, 79, 0.22), transparent 70%),
          radial-gradient(800px 600px at 0% 105%, rgba(255, 77, 79, 0.1), transparent 70%),
          var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25.8"
      data-width="1080"
      data-height="1350"
    >
      <div id="ground" class="clip" data-start="0" data-duration="25.8" data-track-index="0" data-layout-ignore></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 2"
      ></div>
      <div
        id="terminal"
        data-composition-id="terminal"
        data-composition-src="compositions/terminal.html"
        data-start="3.4"
        data-duration="17.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 3"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="21.2"
        data-duration="4.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 4"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
